<body>

</div>

</div>

    const p5 = document.getElementById("p5");
    const p6 = document.getElementById("p6");

    p1.innerText = "Olá Mundo";
    p2.textContent = "Olá Mundo";

    p3.innerText = "Olá Mundo";
    p4.textContent = "Olá Mundo";

    p5.innerText = "Olá Mundo";
    p6.textContent = "Olá Mundo";

    console.log("innerText:", p3.innerText);
