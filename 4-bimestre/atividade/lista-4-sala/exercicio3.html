<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio-1</title>
    <style>
        .alerta{
            background: red;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <h1 id="texto">Alerta!</h1>
    <button id="btn">Alertar!</button>
    <script>
        const btndark = document.getElementById("btn");
        btndark.onclick = function() {
            document.body.classList.toggle("alerta");
        }
    </script>
</body>
</html>
