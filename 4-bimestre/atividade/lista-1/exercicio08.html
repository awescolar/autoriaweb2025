    <script>
        function saudarPessoa(nome) {
            console.log("Olá, " + nome + "!");
        }

        saudarPessoa("Ana");
        saudarPessoa("João");
        saudarPessoa("Maria");

        function somarNums(n1, n2) {
            console.log(n1 + n2);
        }
        somarNums(2, 6);
        somarNums(5, 17);
        somarNums(21, 4);

    </script>
